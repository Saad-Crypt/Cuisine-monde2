<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuisine du Monde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12201e;
    --bg-deep: #0c1614;
    --panel-glass: rgba(244,239,225,0.08);
    --panel-glass-strong: rgba(244,239,225,0.14);
    --panel-border: rgba(244,239,225,0.18);
    --saffron: #e3a857;
    --paprika: #c1443b;
    --sage: #8fa377;
    --cream: #f4efe1;
    --muted: #b9c4b9;
    --shadow: rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(227,168,87,0.14), transparent 45%),
      radial-gradient(circle at 85% 0%, rgba(193,68,59,0.12), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(143,163,119,0.10), transparent 50%),
      var(--bg);
    color: var(--cream);
    font-family: 'Karla', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  /* subtle world-map dot texture */
  body::before{
    content:"";
    position: fixed; inset:0;
    background-image: radial-gradient(rgba(244,239,225,0.06) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events: none;
    z-index: 0;
  }
  .wrap{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding: 0 24px 80px; }

  /* ---------- HERO ---------- */
  header.hero{
    padding: 56px 0 28px;
    text-align:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--saffron);
    margin-bottom: 14px;
  }
  h1.title{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4.4rem);
    line-height: 1.02;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }
  h1.title em{
    font-style: italic;
    font-weight: 500;
    color: var(--saffron);
  }
  .subtitle{
    max-width: 560px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.55;
  }

  /* ---------- FILTER BAR (signature glass element) ---------- */
  .filterbar{
    margin: 40px auto 8px;
    max-width: 920px;
    display:flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items:center;
    padding: 16px;
    border-radius: 20px;
    background: var(--panel-glass);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 18px 40px var(--shadow);
  }
  .field-group{ position: relative; flex: 1 1 220px; }
  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display:block;
    margin: 0 2px 6px;
  }
  select#areaSelect, input#searchInput{
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: rgba(244,239,225,0.07);
    border: 1px solid var(--panel-border);
    color: var(--cream);
    font-family: 'Karla', sans-serif;
    font-size: 0.98rem;
    padding: 12px 16px;
    border-radius: 12px;
    outline: none;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  select#areaSelect{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23e3a857'><path d='M5 7l5 6 5-6z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
    padding-right: 40px;
    cursor: pointer;
  }
  select#areaSelect option{ background: #16302c; color: var(--cream); }
  select#areaSelect:focus, input#searchInput:focus{
    background: rgba(244,239,225,0.13);
    border-color: var(--saffron);
  }
  input#searchInput::placeholder{ color: var(--muted); }

  .btn-fav-toggle{
    flex: 0 0 auto;
    align-self: flex-end;
    background: rgba(193,68,59,0.18);
    border: 1px solid rgba(193,68,59,0.4);
    color: var(--cream);
    padding: 12px 18px;
    border-radius: 12px;
    font-family: 'Karla', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    white-space: nowrap;
  }
  .btn-fav-toggle:hover{ background: rgba(193,68,59,0.3); transform: translateY(-1px); }
  .btn-fav-toggle.active{ background: var(--paprika); border-color: var(--paprika); }

  .status-line{
    max-width: 920px;
    margin: 14px auto 0;
    text-align:center;
    color: var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    min-height: 18px;
  }

  /* ---------- GRID ---------- */
  .grid{
    margin-top: 34px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
  }
  .card{
    background: rgba(244,239,225,0.05);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .card:hover{
    transform: translateY(-4px);
    box-shadow: 0 20px 34px var(--shadow);
    border-color: rgba(227,168,87,0.5);
  }
  .card .thumb-wrap{ position:relative; aspect-ratio: 4/3; overflow:hidden; background:#0c1614;}
  .card img{ width:100%; height:100%; object-fit: cover; display:block; transition: transform 0.4s ease;}
  .card:hover img{ transform: scale(1.06); }
  .card .area-badge{
    position:absolute; top:10px; left:10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: rgba(12,22,20,0.72);
    border: 1px solid rgba(244,239,225,0.22);
    color: var(--saffron);
    padding: 4px 9px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .card .save-btn{
    position:absolute; top:8px; right:8px;
    width: 34px; height:34px;
    border-radius:50%;
    background: rgba(12,22,20,0.65);
    border: 1px solid rgba(244,239,225,0.22);
    color: var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-size: 16px;
    cursor:pointer;
    backdrop-filter: blur(6px);
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .card .save-btn:hover{ transform: scale(1.1); }
  .card .save-btn.saved{ background: var(--paprika); border-color: var(--paprika); }
  .card .meta{ padding: 14px 16px 16px; }
  .card .name{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 1.08rem;
    line-height: 1.25;
    margin: 0;
  }

  .empty-state{
    grid-column: 1/-1;
    text-align:center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .glyph{ font-size: 2.2rem; margin-bottom: 10px; }
  .empty-state p{ font-family:'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.02em; }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(6,12,11,0.72);
    backdrop-filter: blur(4px);
    display:none;
    align-items:center; justify-content:center;
    padding: 24px;
    z-index: 50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background: linear-gradient(180deg, #17302b, #12211e);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    max-width: 780px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 30px 70px rgba(0,0,0,0.5);
    position: relative;
  }
  .modal-hero{ position:relative; height: 260px; overflow:hidden; border-radius: 22px 22px 0 0;}
  .modal-hero img{ width:100%; height:100%; object-fit:cover; display:block; }
  .modal-hero::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(12,22,20,0) 40%, rgba(12,22,20,0.92) 100%);
  }
  .modal-close{
    position:absolute; top:16px; right:16px; z-index:2;
    width:38px; height:38px; border-radius:50%;
    background: rgba(12,22,20,0.7); border:1px solid rgba(244,239,225,0.25);
    color: var(--cream); font-size: 18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-save{
    position:absolute; top:16px; left:16px; z-index:2;
    padding: 8px 16px; border-radius: 999px;
    background: rgba(193,68,59,0.85); border:1px solid var(--paprika);
    color: var(--cream); font-family:'Karla',sans-serif; font-weight:600; font-size:0.86rem;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .modal-save.saved{ background: var(--sage); border-color: var(--sage); color:#12201e; }
  .modal-title-block{ position:absolute; bottom:18px; left:24px; right:24px; z-index:1; }
  .modal-title-block .area-badge{
    font-family:'JetBrains Mono', monospace; font-size: 11px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--saffron); display:inline-block; margin-bottom:8px;
  }
  .modal-title-block h2{
    font-family:'Fraunces', serif; font-weight:600; font-size: 1.9rem; margin:0; line-height:1.05;
  }
  .modal-body{ padding: 28px 30px 34px; }
  .modal-section-title{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing:0.2em; text-transform:uppercase;
    color: var(--sage); margin: 0 0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .modal-section-title::after{ content:""; flex:1; height:1px; background: var(--panel-border); }
  .ingredients-list{
    list-style:none; margin:0 0 32px; padding:0;
    display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
    gap: 10px 18px;
  }
  .ingredients-list li{
    display:flex; justify-content:space-between; gap:10px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--panel-border);
    font-size: 0.94rem;
  }
  .ingredients-list li .ing-name{ color: var(--cream); }
  .ingredients-list li .ing-measure{
    font-family:'JetBrains Mono', monospace; color: var(--saffron); font-size: 0.84rem; white-space:nowrap;
  }
  .steps-list{ list-style:none; margin:0; padding:0; counter-reset: step; }
  .steps-list li{
    counter-increment: step;
    position: relative;
    padding: 4px 0 20px 44px;
    line-height: 1.6;
    color: var(--cream);
    font-size: 0.98rem;
  }
  .steps-list li::before{
    content: counter(step);
    position:absolute; left:0; top:2px;
    width: 30px; height:30px; border-radius:50%;
    background: rgba(227,168,87,0.14);
    border: 1px solid rgba(227,168,87,0.4);
    color: var(--saffron);
    font-family:'JetBrains Mono', monospace; font-size: 12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
  }
  .steps-list li:not(:last-child)::after{
    content:""; position:absolute; left:15px; top:32px; bottom:0; width:1px;
    background: var(--panel-border);
  }
  .modal-link{
    display:inline-block; margin-top: 26px; color: var(--saffron); text-decoration:none;
    font-family:'JetBrains Mono', monospace; font-size: 12px; letter-spacing:0.04em;
    border-bottom: 1px solid rgba(227,168,87,0.4);
  }

  .translate-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin: -6px 0 24px;
  }
  .translate-badge{
    font-family:'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing:0.05em;
    color: var(--sage); display:flex; align-items:center; gap:6px;
  }
  .translate-badge .spinner{
    width:10px; height:10px; border-radius:50%;
    border: 2px solid rgba(143,163,119,0.3); border-top-color: var(--sage);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .toggle-original{
    font-family:'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing:0.04em;
    background: rgba(244,239,225,0.08); border: 1px solid var(--panel-border);
    color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor:pointer;
    display:none;
  }
  .toggle-original:hover{ color: var(--cream); border-color: var(--saffron); }
  .toggle-original.active{ background: var(--saffron); color:#12201e; border-color: var(--saffron); }

  .loader{
    grid-column: 1/-1;
    display:flex; align-items:center; justify-content:center;
    padding: 60px 0;
    color: var(--muted);
    font-family:'JetBrains Mono', monospace; font-size: 13px; letter-spacing:0.05em;
  }
  .loader .dot{ width:6px; height:6px; border-radius:50%; background: var(--saffron); margin: 0 4px; display:inline-block; animation: pulse 1.1s infinite ease-in-out; }
  .loader .dot:nth-child(2){ animation-delay: 0.15s; }
  .loader .dot:nth-child(3){ animation-delay: 0.3s; }
  @keyframes pulse{ 0%,80%,100%{ opacity:0.25; transform: scale(0.8);} 40%{ opacity:1; transform: scale(1);} }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding-top: 50px;
    opacity: 0.7;
  }

  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{
    outline: 2px solid var(--saffron);
    outline-offset: 2px;
  }

  /* ---------- LANGUAGE SWITCHER ---------- */
  .lang-switch{
    position: absolute;
    top: 20px;
    right: 24px;
    display: flex;
    gap: 6px;
    background: var(--panel-glass);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 4px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 5;
  }
  html[dir="rtl"] .lang-switch{ right: auto; left: 24px; }
  .lang-switch button{
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .lang-switch button:hover{ color: var(--cream); }
  .lang-switch button.active{
    background: var(--saffron);
    color: #12201e;
    font-weight: 700;
  }
  header.hero{ position: relative; }
  .note-translation{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    margin: 4px 0 26px;
  }

  /* ---------- RTL (Arabic) ---------- */
  html[dir="rtl"] body{ font-family: 'Tajawal', sans-serif; }
  html[dir="rtl"] h1.title,
  html[dir="rtl"] .modal-title-block h2,
  html[dir="rtl"] .card .name{
    font-family: 'Tajawal', sans-serif;
    font-weight: 800;
  }
  html[dir="rtl"] .eyebrow,
  html[dir="rtl"] .field-label,
  html[dir="rtl"] .status-line,
  html[dir="rtl"] .modal-section-title,
  html[dir="rtl"] .loader,
  html[dir="rtl"] .empty-state p,
  html[dir="rtl"] .ing-measure,
  html[dir="rtl"] .steps-list li::before,
  html[dir="rtl"] footer,
  html[dir="rtl"] .lang-switch button,
  html[dir="rtl"] .note-translation{
    font-family: 'Tajawal', sans-serif;
    letter-spacing: 0;
  }
  html[dir="rtl"] select#areaSelect{
    background-position: left 14px center;
    padding-right: 16px;
    padding-left: 40px;
  }
  html[dir="rtl"] .card .area-badge{ left: auto; right: 10px; }
  html[dir="rtl"] .card .save-btn{ right: auto; left: 8px; }
  html[dir="rtl"] .modal-close{ right: auto; left: 16px; }
  html[dir="rtl"] .modal-save{ left: auto; right: 16px; }
  html[dir="rtl"] .modal-title-block{ left: 24px; right: 24px; text-align: right; }
  html[dir="rtl"] .ingredients-list li,
  html[dir="rtl"] .steps-list li{ direction: rtl; }
  html[dir="rtl"] .steps-list li{ padding: 4px 44px 20px 0; }
  html[dir="rtl"] .steps-list li::before{ left: auto; right: 0; }
  html[dir="rtl"] .steps-list li:not(:last-child)::after{ left: auto; right: 15px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div class="lang-switch" id="langSwitch">
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ar">AR</button>
    </div>
    <div class="eyebrow" id="i18n-eyebrow">Recettes du monde entier</div>
    <h1 class="title" id="i18n-title">Cuisine <em>du Monde</em></h1>
    <p class="subtitle" id="i18n-subtitle">Explorez les meilleures recettes des quatre coins du globe : ingrédients précis, protocole de préparation détaillé, et vos plats préférés à portée de main.</p>
  </header>

  <div class="filterbar">
    <div class="field-group">
      <label class="field-label" id="i18n-areaLabel" for="areaSelect">Cuisine du monde</label>
      <select id="areaSelect"></select>
    </div>
    <div class="field-group">
      <label class="field-label" id="i18n-searchLabel" for="searchInput">Rechercher un plat</label>
      <input id="searchInput" type="text" placeholder="ex. Tagine, Ramen, Paella…" autocomplete="off">
    </div>
    <button class="btn-fav-toggle" id="favToggle" type="button">♥ Mes recettes enregistrées</button>
  </div>
  <div class="status-line" id="statusLine"></div>
  <p class="note-translation" id="i18n-note" style="display:none;"></p>

  <main class="grid" id="grid">
    <div class="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </main>

  <footer id="i18n-footer">Données fournies par TheMealDB · API libre et gratuite</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-hero">
      <img id="modalImg" src="" alt="">
      <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
      <button class="modal-save" id="modalSave" type="button">♡ Enregistrer</button>
      <div class="modal-title-block">
        <span class="area-badge" id="modalArea"></span>
        <h2 id="modalName"></h2>
      </div>
    </div>
    <div class="modal-body">
      <div class="translate-bar">
        <span class="translate-badge" id="translateBadge" style="display:none;"></span>
        <button class="toggle-original" id="toggleOriginal" type="button"></button>
      </div>
      <p class="modal-section-title" id="i18n-sectionIngredients">Ingrédients</p>
      <ul class="ingredients-list" id="modalIngredients"></ul>
      <p class="modal-section-title" id="i18n-sectionSteps">Protocole de préparation</p>
      <ol class="steps-list" id="modalSteps"></ol>
      <a class="modal-link" id="modalYoutube" href="#" target="_blank" rel="noopener" style="display:none;"></a>
    </div>
  </div>
</div>

<script>
const I18N = {
  fr: {
    dir: 'ltr',
    eyebrow: 'Recettes du monde entier',
    titleHTML: 'Cuisine <em>du Monde</em>',
    subtitle: "Explorez les meilleures recettes des quatre coins du globe : ingrédients précis, protocole de préparation détaillé, et vos plats préférés à portée de main.",
    areaLabel: 'Cuisine du monde',
    areaAll: '🌍 Toutes les cuisines',
    searchLabel: 'Rechercher un plat',
    searchPlaceholder: 'ex. Tagine, Ramen, Paella…',
    favToggle: '♥ Mes recettes enregistrées',
    footer: 'Données fournies par TheMealDB · API libre et gratuite',
    translationNote: "Ingrédients et étapes sont traduits automatiquement (API MyMemory) depuis l'anglais d'origine ; la traduction peut être imparfaite.",
    translating: 'Traduction en cours…',
    translated: 'Traduit automatiquement',
    showOriginal: 'Afficher l\'anglais original',
    showTranslated: 'Afficher la traduction',
    sectionIngredients: 'Ingrédients',
    sectionSteps: 'Protocole de préparation',
    save: '♡ Enregistrer',
    saved: '✓ Enregistrée',
    close: 'Fermer',
    watchVideo: '▶ Voir la vidéo sur YouTube',
    loadingRecipe: 'Chargement…',
    recipeNotFound: 'Recette introuvable',
    emptyFav: 'Aucune recette enregistrée pour le moment.',
    emptyResults: 'Aucune recette trouvée. Essayez une autre cuisine ou un autre mot-clé.',
    errorLoad: "Impossible de charger les recettes pour l'instant. Vérifiez votre connexion et réessayez.",
    resultsCount: n => `${n} recette${n !== 1 ? 's' : ''} trouvée${n !== 1 ? 's' : ''}`,
    favCount: n => `${n} recette${n !== 1 ? 's' : ''} enregistrée${n !== 1 ? 's' : ''}`,
  },
  en: {
    dir: 'ltr',

const AREA_NAMES = {
  fr: { American:'Américaine', British:'Britannique', Canadian:'Canadienne', Chinese:'Chinoise', Croatian:'Croate', Dutch:'Néerlandaise', Egyptian:'Égyptienne', Filipino:'Philippine', French:'Française', Greek:'Grecque', Indian:'Indienne', Irish:'Irlandaise', Italian:'Italienne', Jamaican:'Jamaïcaine', Japanese:'Japonaise', Kenyan:'Kényane', Malaysian:'Malaisienne', Mexican:'Mexicaine', Moroccan:'Marocaine', Polish:'Polonaise', Portuguese:'Portugaise', Russian:'Russe', Spanish:'Espagnole', Thai:'Thaïlandaise', Tunisian:'Tunisienne', Turkish:'Turque', Ukrainian:'Ukrainienne', Unknown:'Inconnue', Vietnamese:'Vietnamienne' },
  ar: { American:'أمريكية', British:'بريطانية', Canadian:'كندية', Chinese:'صينية', Croatian:'كرواتية', Dutch:'هولندية', Egyptian:'مصرية', Filipino:'فلبينية', French:'فرنسية', Greek:'يونانية', Indian:'هندية', Irish:'إيرلندية', Italian:'إيطالية', Jamaican:'جامايكية', Japanese:'يابانية', Kenyan:'كينية', Malaysian:'ماليزية', Mexican:'مكسيكية', Moroccan:'مغربية', Polish:'بولندية', Portuguese:'برتغالية', Russian:'روسية', Spanish:'إسبانية', Thai:'تايلاندية', Tunisian:'تونسية', Turkish:'تركية', Ukrainian:'أوكرانية', Unknown:'غير معروفة', Vietnamese:'فيتنامية' },
};

function translateArea(area, lang){
  if(!area) return area;
  if(lang === 'en') return area;
  return (AREA_NAMES[lang] && AREA_NAMES[lang][area]) || area;
}

let currentLang = 'fr';
let rawAreas = [];

const API = "https://www.themealdb.com/api/json/v1/1";
const grid = document.getElementById('grid');
const areaSelect = document.getElementById('areaSelect');
const searchInput = document.getElementById('searchInput');
const favToggle = document.getElementById('favToggle');
const statusLine = document.getElementById('statusLine');

const modalOverlay = document.getElementById('modalOverlay');
const modalImg = document.getElementById('modalImg');
const modalArea = document.getElementById('modalArea');
const modalName = document.getElementById('modalName');
const modalIngredients = document.getElementById('modalIngredients');
const modalSteps = document.getElementById('modalSteps');
const modalYoutube = document.getElementById('modalYoutube');
const modalSave = document.getElementById('modalSave');
const modalClose = document.getElementById('modalClose');

let showingFavorites = false;
let savedIds = new Set();
let currentMealId = null;
let searchDebounce = null;

function loaderHTML(){
  return '<div class="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
}

function emptyStateHTML(text){
  return `<div class="empty-state"><div class="glyph">🍽</div><p>${text}</p></div>`;
}

// ---------- Storage helpers ----------
async function loadSavedIds(){
  try{
    const res = await window.storage.list('saved:', false);
    savedIds = new Set((res && res.keys ? res.keys : []).map(k => k.replace('saved:', '')));
  }catch(e){
    savedIds = new Set();
  }
}

async function isSaved(id){
  return savedIds.has(String(id));
}

async function saveMeal(meal){
  try{
    await window.storage.set('saved:' + meal.idMeal, JSON.stringify(meal), false);
    savedIds.add(String(meal.idMeal));
  }catch(e){ console.error('Erreur de sauvegarde', e); }
}

async function unsaveMeal(id){
  try{
    await window.storage.delete('saved:' + id, false);
    savedIds.delete(String(id));
  }catch(e){ console.error('Erreur de suppression', e); }
}

async function getAllSavedMeals(){
  try{
    const res = await window.storage.list('saved:', false);
    const keys = res && res.keys ? res.keys : [];
    const meals = [];
    for(const k of keys){
      try{
        const item = await window.storage.get(k, false);
        if(item && item.value) meals.push(JSON.parse(item.value));
      }catch(e){}
    }
    return meals;
  }catch(e){ return []; }
}

// ---------- API helpers ----------
async function fetchAreas(){
  const res = await fetch(`${API}/list.php?a=list`);
  const data = await res.json();
  return (data.meals || []).map(m => m.strArea).sort();
}

async function fetchByArea(area){
  const res = await fetch(`${API}/filter.php?a=${encodeURIComponent(area)}`);
  const data = await res.json();
  return data.meals || [];
}

async function fetchBySearch(term){
  const res = await fetch(`${API}/search.php?s=${encodeURIComponent(term)}`);
  const data = await res.json();
  return data.meals || [];
}

async function fetchDetails(id){
  const res = await fetch(`${API}/lookup.php?i=${encodeURIComponent(id)}`);
  const data = await res.json();
  return (data.meals || [])[0] || null;
}

function parseIngredients(meal){
  const list = [];
  for(let i=1; i<=20; i++){
    const name = meal[`strIngredient${i}`];
    const measure = meal[`strMeasure${i}`];
    if(name && name.trim()){
      list.push({ name: name.trim(), measure: measure ? measure.trim() : '' });
    }
  }
  return list;
}

function parseSteps(meal){
  if(!meal.strInstructions) return [];
  return meal.strInstructions
    .split(/\r\n|\n|\r/)
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

// ---------- Translation API (MyMemory - free, no key) ----------
function simpleHash(str){
  let h = 5381;
  for(let i = 0; i < str.length; i++){ h = ((h << 5) + h) + str.charCodeAt(i); h |= 0; }
  return Math.abs(h).toString(36);
}

async function translateText(text, targetLang){
  if(!text || !text.trim()) return text;
  const cacheKey = 'tr:' + targetLang + ':' + simpleHash(text);
  try{
    const cached = await window.storage.get(cacheKey, true);
    if(cached && cached.value) return cached.value;
  }catch(e){ /* not cached yet, continue */ }

  try{
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`;
    const res = await fetch(url);
    const data = await res.json();
    const translated = data && data.responseData && data.responseData.translatedText;
    if(translated && !/MYMEMORY WARNING/i.test(translated)){
      try{ await window.storage.set(cacheKey, translated, true); }catch(e){}
      return translated;
    }
  }catch(e){ /* network/API issue, fall back below */ }
  return text;
}

async function translateList(items, targetLang){
  return Promise.all(items.map(item => translateText(item, targetLang)));
}

// ---------- Rendering ----------
function renderCards(meals){
  const t = I18N[currentLang];
  if(!meals.length){
    grid.innerHTML = emptyStateHTML(showingFavorites ? t.emptyFav : t.emptyResults);
    return;
  }
  grid.innerHTML = '';
  meals.forEach(meal => {
    const card = document.createElement('div');
    card.className = 'card';
    const area = meal.strArea || '';
    const areaDisplay = translateArea(area, currentLang);
    const saved = savedIds.has(String(meal.idMeal));
    card.innerHTML = `
      <div class="thumb-wrap">
        <img src="${meal.strMealThumb}" alt="${meal.strMeal}" loading="lazy">
        ${area ? `<span class="area-badge">${areaDisplay}</span>` : ''}
        <button class="save-btn ${saved ? 'saved' : ''}" data-id="${meal.idMeal}" aria-label="${t.save}">${saved ? '♥' : '♡'}</button>
      </div>
      <div class="meta"><p class="name">${meal.strMeal}</p></div>
    `;
    card.addEventListener('click', (e) => {
      if(e.target.closest('.save-btn')) return;
      openModal(meal.idMeal);
    });
    card.querySelector('.save-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.currentTarget;
      const id = btn.dataset.id;
      if(savedIds.has(String(id))){
        await unsaveMeal(id);
        btn.classList.remove('saved');
        btn.textContent = '♡';
        if(showingFavorites) refresh();
      }else{
        const full = await fetchDetails(id);
        if(full){
          await saveMeal(full);
          btn.classList.add('saved');
          btn.textContent = '♥';
        }
      }
    });
    grid.appendChild(card);
  });
}

let modalOriginal = { ingredients: [], steps: [] };
let modalTranslated = null;
let modalShowingOriginal = false;
let modalRequestToken = 0;

function renderIngredientsAndSteps(ingredients, measures, steps){
  modalIngredients.innerHTML = ingredients.map((name, i) =>
    `<li><span class="ing-name">${name}</span><span class="ing-measure">${measures[i] || ''}</span></li>`
  ).join('');
  modalSteps.innerHTML = steps.map(s => `<li>${s}</li>`).join('');
}

async function openModal(id){
  const t = I18N[currentLang];
  const token = ++modalRequestToken;
  currentMealId = id;
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  modalName.textContent = t.loadingRecipe;
  modalIngredients.innerHTML = '';
  modalSteps.innerHTML = '';
  modalArea.textContent = '';
  modalYoutube.style.display = 'none';
  modalYoutube.textContent = t.watchVideo;
  modalImg.src = '';
  modalTranslated = null;
  modalShowingOriginal = false;
  document.getElementById('translateBadge').style.display = 'none';
  const toggleBtn = document.getElementById('toggleOriginal');
  toggleBtn.style.display = 'none';
  toggleBtn.classList.remove('active');

  const meal = await fetchDetails(id);
  if(token !== modalRequestToken) return; // a newer modal was opened meanwhile
  if(!meal){
    modalName.textContent = t.recipeNotFound;
    return;
  }
  modalImg.src = meal.strMealThumb;
  modalImg.alt = meal.strMeal;
  modalName.textContent = meal.strMeal;
  modalArea.textContent = [translateArea(meal.strArea, currentLang), meal.strCategory].filter(Boolean).join(' · ');

  const ingredientPairs = parseIngredients(meal);
  const ingNames = ingredientPairs.map(i => i.name);
  const ingMeasures = ingredientPairs.map(i => i.measure);
  const steps = parseSteps(meal);
  modalOriginal = { ingNames, ingMeasures, steps };

  // Show the original English content immediately
  renderIngredientsAndSteps(ingNames, ingMeasures, steps);

  if(meal.strYoutube){
    modalYoutube.href = meal.strYoutube;
    modalYoutube.style.display = 'inline-block';
  }

  // If a non-English UI language is active, fetch a real translation
  // from a second, free API (MyMemory) and swap it in once ready.
  if(currentLang !== 'en'){
    const badge = document.getElementById('translateBadge');
    badge.style.display = 'flex';
    badge.innerHTML = `<span class="spinner"></span> ${t.translating}`;
    try{
      const [trNames, trSteps] = await Promise.all([
        translateList(ingNames, currentLang),
        translateList(steps, currentLang)
      ]);
      if(token !== modalRequestToken) return;
      modalTranslated = { ingNames: trNames, steps: trSteps };
      renderIngredientsAndSteps(trNames, ingMeasures, trSteps);
      badge.innerHTML = `🌐 ${t.translated}`;
      toggleBtn.style.display = 'inline-block';
      toggleBtn.textContent = t.showOriginal;
      toggleBtn.onclick = () => {
        modalShowingOriginal = !modalShowingOriginal;
        toggleBtn.classList.toggle('active', modalShowingOriginal);
        toggleBtn.textContent = modalShowingOriginal ? t.showTranslated : t.showOriginal;
        if(modalShowingOriginal){
          renderIngredientsAndSteps(modalOriginal.ingNames, modalOriginal.ingMeasures, modalOriginal.steps);
        }else{
          renderIngredientsAndSteps(modalTranslated.ingNames, modalOriginal.ingMeasures, modalTranslated.steps);
        }
      };
    }catch(e){
      if(token !== modalRequestToken) return;
      badge.style.display = 'none'; // translation failed, keep original text shown
    }
  }

  const saved = savedIds.has(String(meal.idMeal));
  modalSave.classList.toggle('saved', saved);
  modalSave.innerHTML = saved ? t.saved : t.save;
  modalSave.onclick = async () => {
    if(savedIds.has(String(meal.idMeal))){
      await unsaveMeal(meal.idMeal);
      modalSave.classList.remove('saved');
      modalSave.innerHTML = I18N[currentLang].save;
      if(showingFavorites) refresh();
    }else{
      await saveMeal(meal);
      modalSave.classList.add('saved');
      modalSave.innerHTML = I18N[currentLang].saved;
    }
    // sync card state in grid
    const cardBtn = grid.querySelector(`.save-btn[data-id="${meal.idMeal}"]`);
    if(cardBtn){
      const s = savedIds.has(String(meal.idMeal));
      cardBtn.classList.toggle('saved', s);
      cardBtn.textContent = s ? '♥' : '♡';
    }
  };
}

function closeModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
  currentMealId = null;
}
modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

// ---------- Main flow ----------
async function refresh(){
  const t = I18N[currentLang];
  grid.innerHTML = loaderHTML();
  statusLine.textContent = '';

  if(showingFavorites){
    const meals = await getAllSavedMeals();
    statusLine.textContent = t.favCount(meals.length);
    renderCards(meals);
    return;
  }

  const term = searchInput.value.trim();
  const area = areaSelect.value;
  try{
    let meals;
    if(term){
      meals = await fetchBySearch(term);
    }else if(area){
      meals = await fetchByArea(area);
    }else{
      meals = await fetchBySearch('');
    }
    statusLine.textContent = t.resultsCount(meals.length);
    renderCards(meals);
  }catch(e){
    grid.innerHTML = emptyStateHTML(t.errorLoad);
    statusLine.textContent = '';
  }
}

favToggle.addEventListener('click', () => {
  showingFavorites = !showingFavorites;
  favToggle.classList.toggle('active', showingFavorites);
  areaSelect.disabled = showingFavorites;
  searchInput.disabled = showingFavorites;
  refresh();
});

areaSelect.addEventListener('change', () => {
  if(searchInput.value.trim()) searchInput.value = '';
  refresh();
});

searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(refresh, 450);
});

function renderAreaOptions(){
  const t = I18N[currentLang];
  const previousValue = areaSelect.value;
  areaSelect.innerHTML = `<option value="">${t.areaAll}</option>` +
    rawAreas.map(a => `<option value="${a}">${translateArea(a, currentLang)}</option>`).join('');
  areaSelect.value = previousValue;
}

async function applyLanguage(lang){
  currentLang = lang;
  closeModal();
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;

  document.getElementById('i18n-eyebrow').textContent = t.eyebrow;
  document.getElementById('i18n-title').innerHTML = t.titleHTML;
  document.getElementById('i18n-subtitle').textContent = t.subtitle;
  document.getElementById('i18n-areaLabel').textContent = t.areaLabel;
  document.getElementById('i18n-searchLabel').textContent = t.searchLabel;
  document.getElementById('i18n-footer').textContent = t.footer;
  document.getElementById('i18n-sectionIngredients').textContent = t.sectionIngredients;
  document.getElementById('i18n-sectionSteps').textContent = t.sectionSteps;
  const note = document.getElementById('i18n-note');
  note.textContent = t.translationNote;
  note.style.display = lang === 'en' ? 'none' : 'block';
  searchInput.placeholder = t.searchPlaceholder;
  favToggle.textContent = t.favToggle;
  modalClose.setAttribute('aria-label', t.close);
  modalYoutube.textContent = t.watchVideo;

  document.querySelectorAll('#langSwitch button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  renderAreaOptions();
  refresh();

  try{ await window.storage.set('preferredLang', lang, false); }catch(e){}
}

document.getElementById('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if(!btn || btn.dataset.lang === currentLang) return;
  applyLanguage(btn.dataset.lang);
});

async function init(){
  await loadSavedIds();
  try{
    rawAreas = await fetchAreas();
  }catch(e){
    rawAreas = [];
  }

  let startLang = 'fr';
  try{
    const saved = await window.storage.get('preferredLang', false);
    if(saved && saved.value && I18N[saved.value]) startLang = saved.value;
  }catch(e){}

  await applyLanguage(startLang);
}
init();
</script>
