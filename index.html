<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطابخ العالم - موسوعة الطبخ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e67e22;
            --secondary: #27ae60;
            --dark: #1a1a2e;
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.35);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: url('https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=1920&q=80') fixed center/cover;
            min-height: 100vh;
            color: var(--dark);
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background: rgba(0,0,0,0.35); z-index: -1;
        }

        header { text-align: center; padding: 2rem 1rem; }

        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            color: #fff;
            text-shadow: 0 2px 15px rgba(0,0,0,0.4);
            margin-bottom: 1.5rem;
            font-weight: 800;
        }

        /* --- Controls Container --- */
        .controls {
            max-width: 700px;
            margin: 0 auto 2rem;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .glass-select, .glass-input {
            padding: 14px 22px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            font-size: 1rem;
            font-family: inherit;
            color: var(--dark);
            outline: none;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .glass-select { min-width: 200px; cursor: pointer; appearance: none; }
        .glass-input { flex: 1; min-width: 250px; }
        .glass-select:focus, .glass-input:focus { transform: scale(1.02); border-color: var(--primary); }

        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '\f107'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            pointer-events: none; color: var(--dark);
        }

        .search-btn {
            padding: 14px 28px; border-radius: 50px; border: none;
            background: var(--primary); color: #fff; font-family: inherit;
            font-weight: 600; cursor: pointer; box-shadow: var(--shadow); transition: 0.3s;
        }
        .search-btn:hover { background: #d35400; transform: scale(1.05); }

        /* --- Tabs --- */
        .tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 2rem; flex-wrap: wrap; }
        .tab-btn {
            padding: 10px 25px; border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.6);
            background: transparent; color: #fff; font-weight: 600;
            cursor: pointer; transition: 0.3s; font-family: inherit; font-size: 0.95rem;
        }
        .tab-btn.active, .tab-btn:hover { background: #fff; color: var(--primary); border-color: #fff; }

        /* --- Stats Bar --- */
        .stats-bar {
            text-align: center; color: rgba(255,255,255,0.9);
            margin-bottom: 1.5rem; font-size: 0.95rem;
        }

        /* --- Grid --- */
        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px 60px; }
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* --- Card --- */
        .card {
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border-radius: 18px; border: 1px solid var(--glass-border);
            overflow: hidden; box-shadow: var(--shadow); transition: 0.3s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .card-img { height: 210px; object-fit: cover; width: 100%; background: #eee; }
        .card-body { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
        .card-region {
            font-size: 0.8rem; color: var(--primary); font-weight: 700;
            margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-view {
            margin-top: auto; padding: 11px; border: none; border-radius: 12px;
            background: var(--dark); color: #fff; cursor: pointer;
            font-weight: 600; transition: 0.3s; font-family: inherit;
        }
        .btn-view:hover { background: var(--primary); }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px); display: none;
            justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: #fff; width: 100%; max-width: 950px; max-height: 92vh;
            border-radius: 20px; overflow-y: auto; position: relative;
            animation: slideUp 0.4s ease; direction: rtl;
        }
        @keyframes slideUp { from { opacity:0; transform:translateY(40px);} to { opacity:1; transform:translateY(0);} }
        .close-modal {
            position: absolute; top: 15px; left: 20px; font-size: 2rem;
            cursor: pointer; color: #fff; z-index: 10;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6); width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); border-radius: 50%;
        }
        .modal-header { height: 320px; position: relative; }
        .modal-header img { width: 100%; height: 100%; object-fit: cover; }
        .modal-body { padding: 35px; }
        .modal-title { font-size: 2rem; margin-bottom: 5px; font-weight: 800; }
        .modal-region { color: var(--primary); font-weight: 700; margin-bottom: 25px; display: block; font-size: 1.1rem; }

        .detail-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 35px; }
        .section-title {
            color: var(--primary); font-size: 1rem; margin-bottom: 15px;
            font-weight: 800; display: flex; align-items: center; gap: 8px;
        }
        .ingredients-list { list-style: none; }
        .ingredients-list li {
            padding: 9px 0; border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: center; gap: 10px; font-size: 0.95rem;
        }

        .off-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.65rem; padding: 2px 8px; border-radius: 10px;
            margin-right: auto; white-space: nowrap; font-weight: 600;
        }
        .off-loading { background: #fff3cd; color: #856404; }
        .off-good { background: #27ae60; color: #fff; }
        .off-mid { background: #f39c12; color: #fff; }
        .off-bad { background: #e74c3c; color: #fff; }
        .off-none { background: #ecf0f1; color: #7f8c8d; }

        .step {
            margin-bottom: 16px; line-height: 1.8; padding-right: 15px;
            border-right: 3px solid var(--primary); font-size: 0.95rem;
        }
        .btn-fav {
            margin-top: 25px; padding: 14px 30px; border: none; border-radius: 12px;
            background: var(--secondary); color: #fff; cursor: pointer;
            font-weight: 700; font-size: 1rem; transition: 0.3s; font-family: inherit;
        }
        .btn-fav:hover { background: #219a52; }
        .btn-fav.saved { background: #95a5a6; }

        .loader { text-align: center; padding: 60px; color: #fff; font-size: 1.3rem; display: none; }
        .empty-msg { text-align: center; color: #fff; grid-column: 1/-1; font-size: 1.2rem; padding: 40px; }

        @media (max-width: 768px) {
            .detail-grid { grid-template-columns: 1fr; }
            .modal-header { height: 220px; }
            .modal-body { padding: 22px; }
            .controls { flex-direction: column; align-items: stretch; }
            .glass-select, .glass-input, .search-btn { min-width: unset; width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <h1><i class="fas fa-globe-americas"></i> مطابخ العالم</h1>
    
    <div class="controls">
        <div class="select-wrapper">
            <select class="glass-select" id="countrySelect" onchange="onCountryChange()">
                <option value="">⏳ جاري تحميل الدول...</option>
            </select>
        </div>
        <input type="text" class="glass-input" id="searchInput" placeholder="ابحث عن وصفة... (مثال: كبسة، باستا، سوشي)">
        <button class="search-btn" onclick="onSearch()"><i class="fas fa-search"></i> بحث</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('explore', this)">🌍 استكشف</button>
        <button class="tab-btn" onclick="switchTab('favorites', this)">❤️ المفضلة</button>
    </div>

    <div class="stats-bar" id="statsBar"></div>
</header>

<div class="loader" id="loader"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>

<div class="container">
    <div class="recipe-grid" id="recipeContainer"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="recipeModal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-header">
            <img id="modalImg" src="" alt="">
        </div>
        <div class="modal-body">
            <h2 class="modal-title" id="modalTitle"></h2>
            <span class="modal-region" id="modalRegion"></span>
            
            <div class="detail-grid">
                <div>
                    <div class="section-title"><i class="fas fa-carrot"></i> المكونات</div>
                    <ul class="ingredients-list" id="modalIngredients"></ul>
                    <p style="margin-top:12px; font-size:0.78rem; color:#999;">
                        <i class="fas fa-info-circle"></i> الشارات الغذائية من Open Food Facts
                    </p>
                </div>
                <div>
                    <div class="section-title"><i class="fas fa-list-ol"></i> طريقة التحضير</div>
                    <div id="modalInstructions"></div>
                    <button class="btn-fav" id="btnFav" onclick="toggleFavoriteFromModal()">
                        <i class="far fa-heart"></i> حفظ في المفضلة
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// =============================================
// حالة التطبيق
// =============================================
let favorites = JSON.parse(localStorage.getItem('worldCuisineFavs_v2')) || [];
let currentRecipe = null;
let currentTab = 'explore';
let allCountries = [];

const MEALDB_BASE = 'https://www.themealdb.com/api/json/v1/1';
const OFF_BASE = 'https://world.openfoodfacts.org/cgi/search.pl';

// =============================================
// تهيئة التطبيق
// =============================================
document.addEventListener('DOMContentLoaded', async () => {
    await loadCountries();
    // تحميل وصفات عشوائية عند البدء
    await loadRandomMeals();
});

document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') onSearch();
});

// =============================================
// جلب قائمة الدول ديناميكياً من TheMealDB
// =============================================
async function loadCountries() {
    const select = document.getElementById('countrySelect');
    try {
        const res = await fetch(`${MEALDB_BASE}/list.php?a=list`);
        const data = await res.json();
        allCountries = data.meals.map(m => m.strArea).sort();
        
        select.innerHTML = '<option value="">🌍 كل المطابخ العالمية</option>';
        allCountries.forEach(country => {
            const opt = document.createElement('option');
            opt.value = country;
            opt.textContent = getCountryFlag(country) + ' ' + country;
            select.appendChild(opt);
        });
    } catch (e) {
        select.innerHTML = '<option value="">❌ خطأ في تحميل الدول</option>';
        console.error('فشل تحميل الدول:', e);
    }
}

function getCountryFlag(name) {
    const flags = {
        'French':'🇫🇷','Italian':'🇮🇹','Japanese':'🇯🇵','Moroccan':'🇲🇦',
        'Indian':'🇮🇳','Mexican':'🇲🇽','Thai':'🇹🇭','Senegalese':'🇸🇳',
        'Peruvian':'🇵🇪','Chinese':'🇨🇳','Greek':'🇬🇷','Spanish':'🇪🇸',
        'Turkish':'🇹🇷','Vietnamese':'🇻🇳','Korean':'🇰🇷','Lebanese':'🇱🇧',
        'Egyptian':'🇪🇬','Tunisian':'🇹🇳','Algerian':'🇩🇿','Syrian':'🇸🇾',
        'Iraqi':'🇮🇶','Saudi':'🇸🇦','Iranian':'🇮🇷','Filipino':'🇵🇭',
        'Jamaican':'🇯🇲','Russian':'🇷🇺','Polish':'🇵🇱','Portuguese':'🇵🇹',
        'Brazilian':'🇧🇷','Argentinian':'🇦🇷','Colombian':'🇨🇴','Dutch':'🇳🇱',
        'Malaysian':'🇲🇾','Indonesian':'🇮🇩','American':'🇺🇸','British':'🇬🇧',
        'Canadian':'🇨🇦','German':'🇩🇪','Croatian':'🇭🇷','Norwegian':'🇳🇴',
        'Swedish':'🇸🇪','Danish':'🇩🇰','Finnish':'🇫🇮','Irish':'🇮🇪',
        'Scottish':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','Welsh':'🏴󠁧󠁢󠁷󠁬󠁳󠁿','Belgian':'🇧🇪','Austrian':'🇦🇹',
        'Swiss':'🇨🇭','Czech':'🇨🇿','Slovak':'🇸🇰','Hungarian':'🇭🇺',
        'Romanian':'🇷🇴','Bulgarian':'🇧🇬','Serbian':'🇷🇸','Ukrainian':'🇺🇦',
        'Georgian':'🇬🇪','Armenian':'🇦🇲','Azerbaijani':'🇦🇿','Kazakh':'🇰🇿',
        'Uzbek':'🇺🇿','Afghan':'🇦🇫','Pakistani':'🇵🇰','Bangladeshi':'🇧🇩',
        'Nepalese':'🇳🇵','Sri Lankan':'🇱🇰','Myanmar':'🇲🇲','Cambodian':'🇰🇭',
        'Laotian':'🇱🇦','Singaporean':'🇸🇬','Taiwanese':'🇹🇼','Hong Kong':'🇭🇰',
        'Ethiopian':'🇪🇹','Nigerian':'🇳🇬','Ghanaian':'🇬🇭','Kenyan':'🇰🇪',
        'South African':'🇿🇦','Mauritian':'🇲🇺','Trinidadian':'🇹🇹','Haitian':'🇭🇹'
    };
    return flags[name] || '🍽️';
}

// =============================================
// جلب وعرض الوصفات
// =============================================
async function onCountryChange() {
    const country = document.getElementById('countrySelect').value;
    if (!country) {
        await loadRandomMeals();
    } else {
        await loadByCountry(country);
    }
}

async function onSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;
    showLoader(true);
    try {
        const res = await fetch(`${MEALDB_BASE}/search.php?s=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderRecipes(data.meals || [], `نتائج البحث عن "${query}"`);
    } catch (e) {
        renderRecipes([], 'حدث خطأ أثناء البحث');
    }
    showLoader(false);
}

async function loadByCountry(country) {
    showLoader(true);
    try {
        const res = await fetch(`${MEALDB_BASE}/filter.php?a=${encodeURIComponent(country)}`);
        const data = await res.json();
        // filter.php يعيد نتائج مختصرة، نحتاج تفاصيل كل وصفة
        // لجلب أول 20 وصفة بالتفاصيل (لتجنب البطء)
        const meals = (data.meals || []).slice(0, 24);
        const detailed = await Promise.all(
            meals.map(m => 
                fetch(`${MEALDB_BASE}/lookup.php?i=${m.idMeal}`)
                    .then(r => r.json())
                    .then(d => d.meals ? d.meals[0] : null)
            )
        );
        renderRecipes(detailed.filter(Boolean), `مطبخ ${getCountryFlag(country)} ${country}`);
    } catch (e) {
        renderRecipes([], 'حدث خطأ في التحميل');
    }
    showLoader(false);
}

async function loadRandomMeals() {
    showLoader(true);
    try {
        // جلب 24 وصفة عشوائية
        const promises = Array.from({length: 24}, () => 
            fetch(`${MEALDB_BASE}/random.php`).then(r => r.json()).then(d => d.meals[0])
        );
        const meals = await Promise.all(promises);
        renderRecipes(meals.filter(Boolean), '🌍 وصفات عشوائية من حول العالم');
    } catch (e) {
        renderRecipes([], 'حدث خطأ في التحميل');
    }
    showLoader(false);
}

// =============================================
// عرض البطاقات
// =============================================
function renderRecipes(meals, statsText) {
    const container = document.getElementById('recipeContainer');
    const statsBar = document.getElementById('statsBar');
    container.innerHTML = '';
    
    statsBar.textContent = statsText ? `${statsText} — ${meals.length} وصفة` : '';

    if (meals.length === 0) {
        container.innerHTML = '<div class="empty-msg"><i class="fas fa-utensils"></i><br>لا توجد وصفات متاحة</div>';
        return;
    }

    meals.forEach(meal => {
        const ingredients = extractIngredients(meal);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <img class="card-img" src="${meal.strMealThumb}" alt="${meal.strMeal}" loading="lazy">
            <div class="card-body">
                <div class="card-region">${getCountryFlag(meal.strArea)} ${meal.strArea}</div>
                <div class="card-title">${meal.strMeal}</div>
                <button class="btn-view" onclick='openModal(${JSON.stringify(meal).replace(/'/g,"&#39;")})'>عرض الوصفة</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function extractIngredients(meal) {
    const ings = [];
    for (let i = 1; i <= 20; i++) {
        const ing = meal[`strIngredient${i}`];
        const measure = meal[`strMeasure${i}`];
        if (ing && ing.trim()) {
            ings.push({ name: ing.trim(), measure: measure ? measure.trim() : '' });
        }
    }
    return ings;
}

function showLoader(show) {
    document.getElementById('loader').style.display = show ? 'block' : 'none';
}

// =============================================
// المودال + Open Food Facts
// =============================================
async function openModal(meal) {
    currentRecipe = meal;
    const ingredients = extractIngredients(meal);

    document.getElementById('modalImg').src = meal.strMealThumb;
    document.getElementById('modalTitle').textContent = meal.strMeal;
    document.getElementById('modalRegion').textContent = `${getCountryFlag(meal.strArea)} ${meal.strArea}`;

    // طريقة التحضير
    const instrDiv = document.getElementById('modalInstructions');
    const rawInstr = meal.strInstructions || '';
    const steps = rawInstr.split(/\r?\n/).filter(s => s.trim().length > 5);
    instrDiv.innerHTML = steps.length > 0
        ? steps.map((s, i) => `<div class="step"><strong>خطوة ${i+1}:</strong> ${s.replace(/^\d+[\.\)\-]\s*/, '')}</div>`).join('')
        : '<div class="step">الطريقة غير متوفرة لهذا المصدر.</div>';

    updateFavButton();

    // المكونات مع شارات OFF (حالة تحميل مبدئية)
    const ingList = document.getElementById('modalIngredients');
    ingList.innerHTML = ingredients.map(ing => `
        <li>
            <i class="fas fa-check" style="color:var(--secondary)"></i>
            <span>${ing.measure} ${ing.name}</span>
            <span class="off-badge off-loading" data-ing="${ing.name}">
                <i class="fas fa-spinner fa-spin"></i> OFF
            </span>
        </li>
    `).join('');

    document.getElementById('recipeModal').style.display = 'flex';

    // استدعاء Open Food Facts لكل مكون بشكل متوازي
    ingredients.forEach(async (ing) => {
        const badgeEl = document.querySelector(`[data-ing="${CSS.escape(ing.name)}"]`);
        if (!badgeEl) return;
        try {
            const offData = await fetchOFF(ing.name);
            badgeEl.outerHTML = getNutriBadge(offData);
        } catch {
            badgeEl.outerHTML = '<span class="off-badge off-none">غير متاح</span>';
        }
    });
}

async function fetchOFF(ingredientName) {
    const url = `${OFF_BASE}?search_terms=${encodeURIComponent(ingredientName)}&search_simple=1&action=process&json=1&page_size=1`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.count > 0 && data.products[0]) {
        return { found: true, score: data.products[0].nutriscore_grade?.toUpperCase() || null };
    }
    return { found: false };
}

function getNutriBadge(data) {
    if (!data.found) return '<span class="off-badge off-none">مكون طبيعي ✓</span>';
    const map = {
        A: ['off-good','A'], B: ['off-good','B'], C: ['off-mid','C'],
        D: ['off-bad','D'], E: ['off-bad','E']
    };
    const [cls, grade] = map[data.score] || ['off-none', '?'];
    return `<span class="off-badge ${cls}">Nutri-Score ${grade}</span>`;
}

function closeModal() {
    document.getElementById('recipeModal').style.display = 'none';
    currentRecipe = null;
}
window.onclick = (e) => { if (e.target === document.getElementById('recipeModal')) closeModal(); };

// =============================================
// المفضلة
// =============================================
function toggleFavoriteFromModal() {
    if (!currentRecipe) return;
    const idx = favorites.findIndex(f => f.idMeal === currentRecipe.idMeal);
    if (idx === -1) favorites.push(currentRecipe);
    else favorites.splice(idx, 1);
    localStorage.setItem('worldCuisineFavs_v2', JSON.stringify(favorites));
    updateFavButton();
    if (currentTab === 'favorites') renderRecipes(favorites, '❤️ وصفاتي المفضلة');
}

function updateFavButton() {
    const btn = document.getElementById('btnFav');
    const isSaved = favorites.some(f => f.idMeal === currentRecipe.idMeal);
    btn.className = `btn-fav ${isSaved ? 'saved' : ''}`;
    btn.innerHTML = isSaved
        ? '<i class="fas fa-heart"></i> إزالة من المفضلة'
        : '<i class="far fa-heart"></i> حفظ في المفضلة';
}

// =============================================
// التبويبات
// =============================================
function switchTab(tab, btnEl) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    if (tab === 'favorites') {
        renderRecipes(favorites, '❤️ وصفاتي المفضلة');
    } else {
        document.getElementById('countrySelect').value = '';
        loadRandomMeals();
    }
}
</script>
</body>
